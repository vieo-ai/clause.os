# ==============================================================================
# CARRIER OS - HERMETIC WORKSPACE TOOLCHAIN MANIFEST
# ==============================================================================

[env]
# 1. Tell mise to read the canonical .env file as the single source of truth
# _.file = ".env"

# 2. Map system logs and dynamic mise variables
# MISE_LOG_FILE = "{{config_root}}/.home/mise.log"
# MISE_LOG_FILE_LEVEL = "{{env.MISE_LOG_FILE_LEVEL}}"
# MISE_LOG_LEVEL = "{{env.USER_LOG_LEVEL}}"

# 3. Define the root directory for the project and home directories
# CLAUSE_PROJECT_ROOT = "{{config_root}}"
# CLAUSE_HOME = "{{config_root}}/{{env.CLAUSE_HOME}}"
# HOME = "{{config_root}}/{{env.HOME}}"
# USERPROFILE = "{{config_root}}/{{env.USERPROFILE}}"
# GIT_CONFIG_GLOBAL = "{{config_root}}/{{env.GIT_CONFIG_GLOBAL}}"
# NU_CONFIG_DIR = "{{config_root}}/{{env.NU_CONFIG_DIR}}"

# 4. Global bin prepend path
_.path = ["{{ env.CLAUSE_BIN_DIR }}"]

[plugins]
lemonade = "https://github.com/vieo-ai/mise-lemonade.git"
fastflowlm = "https://github.com/vieo-ai/mise-fastflowlm.git"
code = "https://github.com/vieo-ai/mise-vscode.git"
unsloth = "https://github.com/vieo-ai/mise-unsloth.git"
comfyui = "https://github.com/vieo-ai/mise-comfyui.git"

[bootstrap.packages]
"brew:lima" = "latest"

[tools]
# --- 1. CORE LANGUAGE RUNTIMES & COMPILERS (BEAM ECOSYSTEM) ---
# The core execution layer and language compilers for building your application logic.
erlang = "29.1.2"
elixir = "1.20.4-otp-29"
gleam = "1.19.2"
rebar = "3.27.3"

# --- 2. PACKAGE & RUNTIME MANAGEMENT ---
# Local package managers and toolchain managers used to bootstrap other application code.
uv = "0.13.6"

# --- 3. INFRASTRUCTURE AS CODE & PLATFORM ENGINEERING ---
# Tools used to provision, secure, and build the baseline cloud environments and virtual machine images.
pulumi = "3.272.0"
packer = "1.16.2"

# --- 4. CLOUD CONTROL PLANE & WORKLOAD RUNTIME (HASHICORP STACK) ---
# The active clustering, routing, orchestration, and zero-trust orchestration layers running the live environment.
nomad = "2.0.7"
consul = "2.1.0"
vault = "2.2.1"
boundary = "0.21.3"

# --- 5. AI, ML, & DATA PIPELINES ---
# Local engines, language models, or orchestration streaming layers specific to AI workloads.
apm = "v0.33.0"
lemonade = "2026.44.1"
fastflowlm = "1.0.9"
unsloth = "2026.10.9"
comfyui = "v0.43.0"

# --- 6. DEVELOPMENT ENVIRONMENT & UTILITIES ---
# Local developer utilities, editors, or helper tools that don't deploy to production.
code = "1.144.1"

[settings]
auto_install = false
experimental = false
legacy_version_file = false
github_attestations = false