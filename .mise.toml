# ==============================================================================
# CARRIER OS - HERMETIC WORKSPACE TOOLCHAIN MANIFEST
# ==============================================================================

[env]
CLAUSE_PROJECT_ROOT = "{{config_root}}"
CLAUSE_HOME         = "{{config_root}}/.home"
HOME                = "{{config_root}}/.home"
USERPROFILE         = "{{config_root}}/.home"
GIT_CONFIG_GLOBAL   = "{{config_root}}/.home/.gitconfig"
NU_CONFIG_DIR       = "{{config_root}}/scripts/cli/nu/config"

_.path = [
    "{{ env.CLAUSE_BIN_DIR }}",
]

[plugins]
lemonade     = "https://github.com/vieo-ai/mise-lemonade.git"
fastflowlm   = "https://github.com/vieo-ai/mise-fastflowlm.git"
code         = "https://github.com/vieo-ai/mise-vscode.git"

[tools]
# --- 1. BEAM CONCURRENCY & CONTROL PLANE (CARRIER CORE) ---
erlang = "29.1.2"
elixir = "1.20.4-otp-29"
gleam  = "1.19.2"
rebar  = "3.27.3"

# --- 2. PYTHON & PACKAGE RUNTIMES ---
uv     = "0.13.6"

# --- 3. CLOUD INFRASTRUCTURE ---
nomad     = "2.0.7"
consul    = "2.1.0"
vault     = "2.2.1"
boundary  = "0.21.3"
packer    = "1.16.2"
pulumi    = "3.272.0"

# --- 4. AI & ML ---
apm        = "v0.33.0"
lemonade   = "2026.44.1"
fastflowlm = "1.0.9"

# --- 5. DEVOPS & CI/CD ---

# --- 6. DEVTOOLS & UTILITIES ---
code       = "1.144.1"

[settings]
auto_install = false
experimental = false
legacy_version_file = false
github_attestations = false