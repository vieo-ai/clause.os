# ==============================================================================
# [restricted] 00-CORE: HERMETIC BASE ANCHORS & OS PLATFORM HIERARCHY
# Defines canonical root directories, XDG standards, Windows NT Known Folders,
# logging defaults, and drop-in installer paths.
# WARNING: Changing these breaks sandboxing invariants
# ==============================================================================

# ------------------------------------------------------------------------------
# Canonical Anchors (Resolved to absolute paths against PROJECT_ROOT at boot)
# ------------------------------------------------------------------------------
[anchors.posix]
CLAUSE_HOME       = ".home"
CLAUSE_DATA_DIR   = ".home/.local/share"
CLAUSE_CACHE_DIR  = ".home/.cache"
CLAUSE_STATE_DIR  = ".home/.local/state"
CLAUSE_CONFIG_DIR = ".home/.config"
CLAUSE_TEMP_DIR   = ".home/.cache/tmp"

[anchors.windows]
CLAUSE_HOME       = ".home"
CLAUSE_DATA_DIR   = ".home/AppData/Local"
CLAUSE_CACHE_DIR  = ".home/AppData/Local/cache"
CLAUSE_STATE_DIR  = ".home/AppData/Local/state"
CLAUSE_CONFIG_DIR = ".home/AppData/Local/config"
CLAUSE_TEMP_DIR   = ".home/AppData/Local/Temp"

# ------------------------------------------------------------------------------
# Cross-Platform Core Environment
# ------------------------------------------------------------------------------
[env]
# [optional] Runtime logging & diagnostics (trace | debug | info | warn | error)
USER_LOG_LEVEL      = ""
MISE_LOG_FILE_LEVEL = ""

# Hermetic base confinement
CLAUSE_HOME = "${CLAUSE_HOME}"
HOME        = "${CLAUSE_HOME}"
USERPROFILE = "${CLAUSE_HOME}"

# ------------------------------------------------------------------------------
# POSIX / XDG Directory Standards (Linux, macOS, WSL)
# ------------------------------------------------------------------------------
[env.posix]
XDG_CONFIG_HOME = "${CLAUSE_CONFIG_DIR}"
XDG_DATA_HOME   = "${CLAUSE_DATA_DIR}"
XDG_STATE_HOME  = "${CLAUSE_STATE_DIR}"
XDG_CACHE_HOME  = "${CLAUSE_CACHE_DIR}"

CLAUSE_BIN_DIR  = "${CLAUSE_HOME}/.local/bin"
CLAUSE_APPS_DIR = "${CLAUSE_HOME}/.local/apps"
CLAUSE_LOGS_DIR = "${CLAUSE_HOME}/.local/logs"
CLAUSE_TEMP_DIR = "${CLAUSE_TEMP_DIR}"
INSTALLERS_DIR  = "scripts/cli/posix/installers"

# ------------------------------------------------------------------------------
# Windows NT Platform Hierarchy & Scratch Confinement
# ------------------------------------------------------------------------------
[env.windows]
LOCALAPPDATA    = "${CLAUSE_DATA_DIR}"
APPDATA         = "${CLAUSE_HOME}/AppData/Roaming"
CLAUSE_BIN_DIR  = "${CLAUSE_DATA_DIR}/Programs/bin"
CLAUSE_APPS_DIR = "${CLAUSE_DATA_DIR}/Programs/apps"
CLAUSE_LOGS_DIR = "${CLAUSE_DATA_DIR}/Programs/logs"
CLAUSE_TEMP_DIR = "${CLAUSE_TEMP_DIR}"
CLAUSE_CACHE_DIR = "${CLAUSE_CACHE_DIR}"

TEMP            = "${CLAUSE_TEMP_DIR}"
TMP             = "${CLAUSE_TEMP_DIR}"
HOMEDRIVE       = ""
HOMEPATH        = ""
INSTALLERS_DIR  = "scripts/cli/pwsh/installers"