name: ClauseOS Toolchain CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.config/**'
      - '.clause.toml'
      - '.mise.toml'
      - 'clause.ps1'
      - 'clause.sh'
      - 'clause.bat'
      - 'justfile'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - '.config/**'
      - '.clause.toml'
      - '.mise.toml'
      - 'clause.ps1'
      - 'clause.sh'
      - 'clause.bat'
      - 'justfile'
      - '.github/workflows/**'

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: Detect Runner Availability
  # ---------------------------------------------------------------------------
  detect-runner:
    name: Determine Optimal Runner Platform
    runs-on: ubuntu-latest
    outputs:
      linux_runner: ${{ steps.set-runner.outputs.linux_runner }}
      windows_runner: ${{ steps.set-runner.outputs.windows_runner }}
    steps:
      - id: set-runner
        run: |
          # If running in private/self-hosted context with local labels configured
          # Default to self-hosted labels if available, otherwise fall back to GitHub-hosted
          if [ "${{ vars.USE_SELF_HOSTED }}" = "true" ]; then
            echo "linux_runner=[\"self-hosted\", \"linux\"]" >> $GITHUB_OUTPUT
            echo "windows_runner=[\"self-hosted\", \"windows\"]" >> $GITHUB_OUTPUT
          else
            echo "linux_runner=[\"ubuntu-latest\"]" >> $GITHUB_OUTPUT
            echo "windows_runner=[\"windows-latest\"]" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Step 2: Execute Tests on Resolved Runners
  # ---------------------------------------------------------------------------
  test-workbench:
    name: Test ClauseOS Bootloader (${{ matrix.os }})
    needs: detect-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: POSIX
            runner: ${{ fromJson(needs.detect-runner.outputs.linux_runner) }}
          - os: Windows
            runner: ${{ fromJson(needs.detect-runner.outputs.windows_runner) }}

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git Settings
        run: |
          git config core.fileMode false
          git config core.symlinks true

      # --- POSIX Test (Linux / macOS) ---
      - name: Test ClauseOS Stage 0 Boot (POSIX)
        if: runner.os != 'Windows'
        run: |
          chmod +x clause.sh
          ./clause.sh

      # --- Windows Test ---
      - name: Test ClauseOS Stage 0 Boot (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\clause.ps1