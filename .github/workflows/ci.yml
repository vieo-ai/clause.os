name: ClauseOS Toolchain CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.config/**'
      - '.clause.toml'
      - '.mise.toml'
      - 'clause.ps1'
      - 'clause.sh'
      - 'clause.bat'
      - 'justfile'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.config/**'
      - '.clause.toml'
      - '.mise.toml'
      - 'clause.ps1'
      - 'clause.sh'
      - 'clause.bat'
      - 'justfile'
      - '.github/workflows/**'

jobs:
  # ---------------------------------------------------------------------------
  # Step 1: Detect Runner Availability
  # ---------------------------------------------------------------------------
  detect-runner:
    name: Determine Optimal Runner Platform
    runs-on: ubuntu-latest
    outputs:
      linux_runner: ${{ steps.set-runner.outputs.linux_runner }}
      macos_runner: ${{ steps.set-runner.outputs.macos_runner }}
      windows_runner: ${{ steps.set-runner.outputs.windows_runner }}
    steps:
      - id: set-runner
        run: |
          if [ "${{ vars.USE_SELF_HOSTED }}" = "true" ]; then
            echo "linux_runner=[\"self-hosted\", \"linux\"]" >> $GITHUB_OUTPUT
            echo "macos_runner=[\"self-hosted\", \"macOS\"]" >> $GITHUB_OUTPUT
            echo "windows_runner=[\"self-hosted\", \"windows\"]" >> $GITHUB_OUTPUT
          else
            echo "linux_runner=[\"ubuntu-latest\"]" >> $GITHUB_OUTPUT
            echo "macos_runner=[\"macos-latest\"]" >> $GITHUB_OUTPUT
            echo "windows_runner=[\"windows-latest\"]" >> $GITHUB_OUTPUT
          fi

  # ---------------------------------------------------------------------------
  # Step 2: Execute Tests on Resolved Matrix
  # ---------------------------------------------------------------------------
  test-workbench:
    name: Test ClauseOS Bootloader (${{ matrix.os }})
    needs: detect-runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            runner: ${{ fromJson(needs.detect-runner.outputs.linux_runner) }}
          - os: macOS
            runner: ${{ fromJson(needs.detect-runner.outputs.macos_runner) }}
          - os: Windows
            runner: ${{ fromJson(needs.detect-runner.outputs.windows_runner) }}

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure Git Settings
        run: |
          git config core.fileMode false
          git config core.symlinks true

      # --- POSIX Test & Systems Assertion Suite (Linux & macOS) ---
      - name: Test ClauseOS Stage 0 Boot & Assertion Suite (POSIX)
        if: runner.os != 'Windows'
        run: |
          chmod +x start.sh
          CI=true ./start.sh
          ./start.sh test

      # --- Windows Test & Systems Assertion Suite ---
      - name: Test ClauseOS Stage 0 Boot & Assertion Suite (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:CI = "true"
          .\start.bat
          .\start.bat test